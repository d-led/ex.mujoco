name: ci

# The gates a change has to pass.
#
#   lint    compile --warnings-as-errors, formatting, credo --strict, and the
#           versions agreeing with each other. Fails fastest, so it tells you
#           first.
#   test    the suite, on all three platforms this package claims to build on.
#           That claim is the whole point of `scripts/prepare_mujoco.exs`, so a
#           platform that is not in this matrix is a platform nobody checked.
#   gen     `mix ex_mujoco.gen --check`: the committed bindings still agree with
#           the MuJoCo the build fetched. A MuJoCo bump without a regeneration
#           fails here rather than drifting.
#   types   dialyzer, against a PLT the cache carries between runs.
#
# `release`, in its own workflow, publishes to Hex and attaches the source to a
# GitHub release, from a `v*.*.*` tag and only on a tag.
#
# What does *not* run: a commit that only touched prose.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", "NOTICE"]
  workflow_dispatch:

permissions:
  contents: read

# Keyed by commit, not by branch: two pushes in a row are two commits' worth of
# evidence, and a queued macOS job that a later push cancels never ran at all.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv
          key: lint-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: lint-${{ runner.os }}-
      - run: mix deps.get
      # The headers are needed before anything compiles: the NIF includes them.
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      # A version edited in one file and not in the others survives until the tag,
      # and then the tag is refused — so the disagreement is caught on the push
      # that made it.
      - run: elixir scripts/release.exs check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No macOS: this repository's account has no macOS runner, and a job
        # that cannot start is cancelled rather than failed, which turns every
        # run red for something the build did not do. macOS is the machine this
        # is developed on; `docs/building.md` is where it is verified.
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # `nmake` and `cl` are not on PATH on a runner by default; this is where
      # the MSVC side of `Makefile.win` comes from.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv
          key: test-${{ matrix.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: test-${{ matrix.os }}-
      - run: mix deps.get
      - run: mix compile
      # What the module actually needs, when a Windows runner says it cannot find
      # something. Compile first so there is a module to ask about.
      # `mujoco.dll` imports the Visual C++ runtime, which a runner has but does
      # not have on PATH. Loading twice — as the library names its own directory,
      # and then with the runtime on PATH as well — says which of the two a
      # failure is about.
      - name: Does the NIF load
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PRIV=%CD%\_build\test\lib\ex_mujoco\priv
          echo [nothing added]
          call mix run -e "IO.puts ExMujoco.Native.version()" || echo FAILED-0
          echo [priv on PATH]
          set PATH=%PRIV%;%PATH%
          call mix run -e "IO.puts ExMujoco.Native.version()" || echo FAILED-1
          echo [priv and the C++ runtime on PATH]
          set PATH=%PRIV%;%VCToolsRedistDir%x64\Microsoft.VC143.CRT;%PATH%
          call mix run -e "IO.puts ExMujoco.Native.version()" || echo FAILED-2
      - run: mix test

  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv
          key: gen-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: gen-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile
      # Regenerates into a comparison and writes nothing.
      - run: mix ex_mujoco.gen --check

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv
            priv/plts
          key: types-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: types-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile
      - run: mkdir -p priv/plts
      - run: mix dialyzer
