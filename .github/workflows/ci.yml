name: ci

# The gates a change has to pass.
#
#   lint    compile --warnings-as-errors, formatting, credo --strict, and the
#           versions agreeing with each other. Fails fastest, so it tells you
#           first.
#   test    the suite, on all three platforms this package claims to build on.
#           That claim is the whole point of `scripts/prepare_mujoco.exs`, so a
#           platform that is not in this matrix is a platform nobody checked.
#   gen     `mix ex_mujoco.gen --check`: the committed bindings still agree with
#           the MuJoCo the build fetched. A MuJoCo bump without a regeneration
#           fails here rather than drifting.
#   types   dialyzer, against a PLT the cache carries between runs.
#
# `release`, in its own workflow, publishes to Hex and attaches the source to a
# GitHub release, from a `v*.*.*` tag and only on a tag.
#
# What does *not* run: a commit that only touched prose.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", "NOTICE"]
  workflow_dispatch:

permissions:
  contents: read

# Keyed by commit, not by branch: two pushes in a row are two commits' worth of
# evidence, and a queued macOS job that a later push cancels never ran at all.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv
          key: lint-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: lint-${{ runner.os }}-
      - run: mix deps.get
      # The headers are needed before anything compiles: the NIF includes them.
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      # A version edited in one file and not in the others survives until the tag,
      # and then the tag is refused — so the disagreement is caught on the push
      # that made it.
      - run: elixir scripts/release.exs check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No macOS: this repository's account has no macOS runner, and a job
        # that cannot start is cancelled rather than failed, which turns every
        # run red for something the build did not do. macOS is the machine this
        # is developed on; `docs/building.md` is where it is verified.
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # `nmake` and `cl` are not on PATH on a runner by default; this is where
      # the MSVC side of `Makefile.win` comes from.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # The renderer's own cases are the half of this suite a machine without
      # OpenGL skips, and `test (ubuntu-24.04)` skipped them for as long as it
      # had none — long enough for a Linux EGL config that could not render to
      # ship. Mesa's surfaceless EGL is the stack MuJoCo's own CI renders with:
      # no display, no GPU.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv
          key: test-${{ matrix.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: test-${{ matrix.os }}-
      # A cache that already holds a MuJoCo means the download and the unpack
      # never run — which is how a Linux release download stayed broken for
      # every run that was green. The artifact is fetched again on every run,
      # because fetching it is what a first-time user does.
      - run: rm -rf _build/mujoco
        shell: bash
      - run: mix deps.get
      - run: mix compile
      # What the module actually needs, when a Windows runner says it cannot find
      # something. Compile first so there is a module to ask about.
      # Three libraries have to resolve before the suite is worth running: the
      # NIF, the preloader that puts MuJoCo in the process, and MuJoCo itself.
      # `bash` on every runner: PowerShell hands `mix` (a batch file) to `cmd`
      # with the parentheses of an Elixir call requoted, and `cmd` says
      # ") was unexpected at this time".
      - name: The libraries load
        shell: bash
        run: mix run -e "IO.puts ExMujoco.version()"
      # Whether a runner renders is a fact about the runner, and a run that does
      # not say so leaves the quiet half of the matrix — every case that skips —
      # unobserved. Printed here, before the suite, so a platform that cannot
      # render says which one and why.
      - name: Whether it renders here
        shell: bash
        run: |
          mix run -e 'IO.inspect({ExMujoco.Renderer.available?(), ExMujoco.Renderer.unavailable_reason()}, label: "renderer")'
      - run: mix test
      # A release runs every `@on_load` hook while the kernel is still starting,
      # which is the one arrangement this suite cannot make and a host's server
      # always is: 0.2.3 died there, in `on_load_function_failed`, before any
      # application started. One Linux job, because the boot script that does it
      # is the same script everywhere and a second one would say nothing new.
      - name: It starts in a release
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/release-boot.sh

  # What a user gets is the tarball, not this checkout. Building it and then
  # using it from a directory that holds nothing else says whether every file
  # the build reads is in it — `mujoco.version` was not, so the package could not
  # compile as a dependency anywhere.
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: mix deps.get
      - run: mix hex.build
      # `pkgdir` and `consumer` are relative to the checkout: a Windows runner's
      # `$RUNNER_TEMP` is a backslash path, which bash and tar each read
      # differently.
      - name: Unpack it the way Hex does
        shell: bash
        run: |
          rm -rf pkgdir
          mkdir -p pkgdir/contents
          tar xf ex_mujoco-*.tar -C pkgdir
          tar xf pkgdir/contents.tar.gz -C pkgdir/contents
          ls pkgdir/contents
      - name: Use it from an empty directory
        shell: bash
        run: |
          rm -rf consumer
          mkdir -p consumer
          cd consumer
          cat > check.exs <<'EXS'
          # A path dependency on what Hex would have installed, with no `mix.exs`
          # of our own: this is `Mix.install/2`, which is how a reader tries a
          # package before writing a project around it.
          Mix.install([{:ex_mujoco, path: "../pkgdir/contents"}])

          xml = """
          <mujoco>
            <worldbody>
              <body>
                <joint type="hinge" axis="0 1 0"/>
                <geom type="capsule" fromto="0 0 0 0 0 -0.1" size="0.01"/>
              </body>
            </worldbody>
          </mujoco>
          """

          {:ok, model} = ExMujoco.load_string(xml)
          data = ExMujoco.data(model)

          :ok = ExMujoco.forward(data)
          :ok = ExMujoco.step(data)

          unless ExMujoco.version() == ExMujoco.header_version() do
            raise "the library is #{ExMujoco.version()} and the headers are #{ExMujoco.header_version()}"
          end

          # A model MuJoCo refuses is the library's own error, not a dead VM. The
          # struct is compared at run time: `check.exs` is compiled before
          # `Mix.install/2` has loaded it.
          {:error, refused} = ExMujoco.load_string("<mujoco><worldbody><body></worldbody></mujoco>")

          unless refused.__struct__ == ExMujoco.Error do
            raise "a refused model answered #{inspect(refused)}"
          end

          IO.puts("installed and stepped: library #{ExMujoco.version()}, nq #{ExMujoco.Model.nq(model)}")
          EXS
          elixir check.exs

  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv
          key: gen-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: gen-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile
      # Regenerates into a comparison and writes nothing.
      - run: mix ex_mujoco.gen --check

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv
            priv/plts
          key: types-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: types-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile
      - run: mkdir -p priv/plts
      - run: mix dialyzer
